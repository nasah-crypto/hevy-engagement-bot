name: Likes des amis Hevy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/amis-hevy.yml
      - friends_bot.py
      - social_bot.py
      - tests/**
  workflow_dispatch:
    inputs:
      mode:
        description: "Verifier, liker, controler ou lancer likes et abonnements"
        type: choice
        required: true
        default: verifier
        options:
          - verifier
          - liker
          - controler
          - automatique
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: hevy-friends
  cancel-in-progress: false

jobs:
  amis:
    if: github.event_name != 'schedule' || vars.HEVY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer le composant de chiffrement
        run: python -m pip install 'cryptography==50.0.2'
      - name: Verifier les protections du bot
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Identifier la connexion
        id: session
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
        run: |
          session_id="$(python friends_bot.py --cache-id)"
          echo "id=$session_id" >> "$GITHUB_OUTPUT"
      - name: Retrouver la connexion chiffree
        uses: actions/cache/restore@v4
        with:
          path: .hevy-state/session.enc
          key: hevy-session-v1-${{ steps.session.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hevy-session-v1-${{ steps.session.outputs.id }}-
      - name: Examiner les seances des amis
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
          HEVY_EXPECTED_USERNAME: abakayhasan
          RUN_MODE: ${{ github.event_name == 'schedule' && 'liker' || inputs.mode || 'controler' }}
        run: |
          case "$RUN_MODE" in
            liker|automatique) timeout --signal=INT --kill-after=15s 18m python friends_bot.py --apply ;;
            controler) timeout --signal=INT --kill-after=15s 18m python friends_bot.py --audit ;;
            *) timeout --signal=INT --kill-after=15s 18m python friends_bot.py ;;
          esac
      - name: Gerer les abonnements et les retours
        if: ${{ !cancelled() && steps.session.outputs.id != '' }}
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
          HEVY_EXPECTED_USERNAME: abakayhasan
          APPLY_SOCIAL: ${{ github.event_name == 'schedule' || inputs.mode == 'automatique' }}
          FOLLOW_ENABLED: ${{ vars.HEVY_FOLLOW_ENABLED != 'false' }}
          UNFOLLOW_ENABLED: ${{ vars.HEVY_UNFOLLOW_ENABLED != 'false' }}
          CLEANUP_EXISTING: ${{ vars.HEVY_CLEANUP_EXISTING != 'false' }}
        run: |
          extra_args=()
          if [ "$CLEANUP_EXISTING" = "true" ]; then
            extra_args+=(--cleanup-existing)
          fi
          if [ "$FOLLOW_ENABLED" != "true" ]; then
            extra_args+=(--no-follow)
          fi
          if [ "$UNFOLLOW_ENABLED" != "true" ]; then
            extra_args+=(--no-unfollow)
          fi
          if [ "$APPLY_SOCIAL" = "true" ]; then
            timeout --signal=INT --kill-after=15s 8m python social_bot.py --apply "${extra_args[@]}"
          else
            timeout --signal=INT --kill-after=15s 8m python social_bot.py "${extra_args[@]}"
          fi
      - name: Verifier la disponibilite des demandes recues
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
          HEVY_EXPECTED_USERNAME: abakayhasan
        run: timeout --signal=INT --kill-after=15s 8m python social_bot.py --inspect-requests
      - name: Conserver uniquement la connexion chiffree
        if: always() && steps.session.outputs.id != '' && hashFiles('.hevy-state/session.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .hevy-state/session.enc
          key: hevy-session-v1-${{ steps.session.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
