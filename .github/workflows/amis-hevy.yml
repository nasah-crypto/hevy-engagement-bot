name: Likes des amis Hevy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verifier sans liker, ou liker les seances des amis"
        type: choice
        required: true
        default: verifier
        options:
          - verifier
          - liker
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: hevy-friends
  cancel-in-progress: false

jobs:
  amis:
    if: github.event_name == 'workflow_dispatch' || vars.HEVY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer le composant de chiffrement
        run: python -m pip install 'cryptography==50.0.2'
      - name: Identifier la connexion
        id: session
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
        run: |
          session_id="$(python friends_bot.py --cache-id)"
          echo "id=$session_id" >> "$GITHUB_OUTPUT"
      - name: Retrouver la connexion chiffree
        uses: actions/cache/restore@v4
        with:
          path: .hevy-state/session.enc
          key: hevy-session-v1-${{ steps.session.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hevy-session-v1-${{ steps.session.outputs.id }}-
      - name: Examiner les seances des amis
        env:
          HEVY_AUTH_JSON: ${{ secrets.HEVY_AUTH_JSON }}
          HEVY_EXPECTED_USERNAME: abakayhasan
          APPLY_LIKES: ${{ github.event_name == 'schedule' || inputs.mode == 'liker' }}
        run: |
          if [ "$APPLY_LIKES" = "true" ]; then
            python friends_bot.py --apply
          else
            python friends_bot.py
          fi
      - name: Conserver uniquement la connexion chiffree
        if: always() && steps.session.outputs.id != '' && hashFiles('.hevy-state/session.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .hevy-state/session.enc
          key: hevy-session-v1-${{ steps.session.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
